<!DOCTYPE html>
<html>
    <head lang="en">
        <!--metadata to specify characterset and  view design to support easily on mobile or any other device-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=1.0 ">

        <title> RheaCorp Business Solutions Ltd. </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!--Hero Section-->
        <header class="hero">
            <img src="logo.jpeg" alt="RheaCorp Logo" class="logo">
            <!--Container Section-->
            <div class="container">
                <h1>Tagline 1</h1>
                <p>Tagline 2</p>
                <!--Button-->
                <a href="#" class="btn">View Solutions</a> 
            </div>
        </header>
        
        <main>
            <section class="features">
                <h2> Our Features </h2>
                <div class="features-grid">
                    <article class="feature-card"><h2>Feature 1</h2></article>
                    <article class="feature-card"><h2>Feature 2</h2></article>
                    <article class="feature-card"><h2>Feature 3</h2></article>
                    <article class="feature-card"><h2>Feature 4</h2></article>
                </div>
            </section>

            <section class="testimonials">
                <h2>Testimonials</h2>

                <div class="carousel">
                    <input type="radio" name="slider" id="slide1" checked>
                    <input type="radio" name="slider" id="slide2">
                    <input type="radio" name="slider" id="slide3">

                    <div class="slides">
                        <div class="slide">"Amazing service!"</div>
                        <div class="slide">"Boosted our growth."</div>
                        <div class="slide">"Highly recommended."</div>
                    </div>

                    <div class="controls">
                        <label for="slide1"></label>
                        <label for="slide2"></label>
                        <label for="slide3"></label>
                    </div>
                </div>
            </section>

            <section class="pricing">
                <h2> Pricing Plans </h2>
                <div class="pricing-grid">
                    <article class="feature-card"><h2 >Plan 1</h2></article>
                    <article class="feature-card"><h2>Plan2</h2></article>
                    <article class="feature-card"><h2>Plan 3</h2></article>
                </div>
            </section>

        </main>

        <footer>
            <p>2026 RheaCorp Ltd.</p>
        </footer>
    </body>
</html>
